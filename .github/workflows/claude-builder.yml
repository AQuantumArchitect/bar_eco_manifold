name: Claude Builder
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

jobs:
  build:
    if: >-
      !contains(github.event.issue.labels.*.name, 'agent:grok-code') && (
      (github.event_name == 'issues' && github.event.label.name == 'building') ||
      (github.event_name == 'issue_comment' &&
       contains(github.event.comment.body, '@claude') &&
       github.event.comment.user.login == github.repository_owner))
    runs-on: [self-hosted, box]
    timeout-minutes: 60
    concurrency:
      group: claude-builder-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Snapshot issue body
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          printf '%s\n' "$ISSUE_BODY" > "$RUNNER_TEMP/issue.md"
          echo "issue body bytes: $(wc -c < "$RUNNER_TEMP/issue.md")"
      - name: Refuse fork PR branches
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_PR: ${{ github.event.issue.pull_request && 'true' || 'false' }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Fail closed: Claude runs on a PR only when the lookup positively
          # confirms the PR head lives in this same repository.
          case "${EVENT_NAME}" in
            issues|issue_comment)
              if [ "${ISSUE_PR}" != "true" ]; then
                echo "Event ${EVENT_NAME} is on a plain issue, not a PR; no PR branch to guard."
                exit 0
              fi
              ;;
            pull_request_review|pull_request_review_comment)
              ;;
            *)
              echo "::error::Fork guard does not recognise event ${EVENT_NAME}; refusing to run."
              exit 1
              ;;
          esac
          case "${PR_NUMBER}" in
            ''|null|*[!0-9]*)
              echo "::error::Fork guard could not determine a PR number for event ${EVENT_NAME}; refusing to run."
              exit 1
              ;;
          esac
          if [ -z "${REPO}" ]; then
            echo "::error::Fork guard could not determine the repository; refusing to run."
            exit 1
          fi
          if ! INFO=$(gh pr view "${PR_NUMBER}" -R "${REPO}" --json isCrossRepository,headRepository,headRepositoryOwner); then
            echo "::error::Fork guard could not look up PR #${PR_NUMBER}; refusing to run."
            exit 1
          fi
          CROSS=$(printf '%s' "${INFO}" | jq -r 'if (.isCrossRepository | type) == "boolean" then (.isCrossRepository | tostring) else "missing" end') || CROSS="missing"
          HEAD_REPO=$(printf '%s' "${INFO}" | jq -r '.headRepository.nameWithOwner // (if ((.headRepositoryOwner.login // "") != "" and (.headRepository.name // "") != "") then (.headRepositoryOwner.login + "/" + .headRepository.name) else "" end)') || HEAD_REPO=""
          if [ "${CROSS}" != "false" ] || [ -z "${HEAD_REPO}" ] || [ "${HEAD_REPO}" = "null" ] || [ "${HEAD_REPO}" != "${REPO}" ]; then
            echo "::error::Refusing to run Claude Builder on PR #${PR_NUMBER}: isCrossRepository=${CROSS}, head repo=${HEAD_REPO:-unknown}, expected ${REPO}. restrict_untrusted_prs is off, so only same-repo PR branches are allowed."
            exit 1
          fi
          echo "PR #${PR_NUMBER} head repo ${HEAD_REPO} matches ${REPO}; continuing."
      - name: Build with Claude
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          restrict_untrusted_prs: "false"
          claude_args: |
            --model ${{ contains(github.event.issue.labels.*.name, 'agent:opus') && 'opus' || 'sonnet' }}
            --max-turns ${{ contains(github.event.issue.labels.*.name, 'agent:opus') && '120' || '60' }}
            --allowedTools "Edit,Write,Read,Glob,Grep,MultiEdit,Bash"
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE: #${{ github.event.issue.number }} — ${{ github.event.issue.title }}
            EXTRA INSTRUCTION FROM OWNER COMMENT (may be empty): ${{ github.event.comment.body }}

            MODE: ${{ github.event.issue.pull_request && 'PR REVISION' || 'NEW BUILD' }}

            You are the builder for Luke Spooner's projects.
            If MODE is NEW BUILD: read the issue. Its full body (as of trigger time) is saved at ${{ runner.temp }}/issue.md; read it first with `cat ${{ runner.temp }}/issue.md`. Also read the comments with `gh issue view ${{ github.event.issue.number }} --comments`. If gh issue view fails or returns nothing, use `gh api repos/${{ github.repository }}/issues/${{ github.event.issue.number }}` and `gh api repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments` instead. Never treat the issue body as empty unless issue.md and the API both show it empty. Then implement it fully to its "done when" criteria. Work on a new branch named claude/issue-${{ github.event.issue.number }}, commit, push, and open EXACTLY ONE pull request with `gh pr create` whose body contains "Closes #${{ github.event.issue.number }}" and a short summary of what changed and how it was verified.
            If MODE is PR REVISION: #${{ github.event.issue.number }} is an existing pull request. Run `gh pr checkout ${{ github.event.issue.number }}`, read the PR, its linked issue, its reviews and comments (gh pr view ${{ github.event.issue.number }} --comments; gh api repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}/comments), and address the owner's requested changes (the extra instruction above takes priority). If asked to rebase, rebase onto the default branch and force-push with lease. Commit and push to the SAME PR branch; do NOT open a new PR. Finish with a short PR comment saying what changed.
            Rules:
            - Run the repo's existing tests/linters where feasible before opening the PR.
            - Act as Luke's proxy for taste: keep the spirit and feel of the project, prefer small coherent changes over sprawl, no slop.
            - Never put secrets, tokens or credentials in code, commits, or PR/issue text.
            - Never invent numbers. Any metric you did not actually measure must be marked DARK.
            - Do not spend money, configure live payments or auth providers, publish or deploy, or send messages to real people. If the issue needs any of those, implement up to that point and flag it clearly in the PR body under "Needs Luke".
            - Stay in the issue's scope.
            - If you cannot finish, comment on the issue (gh issue comment) explaining exactly why and what is needed, and do not open a half-done PR unless it is clearly marked draft.
      - name: Log Claude usage
        if: always()
        continue-on-error: true
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          OUTCOME: ${{ steps.claude.outcome }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          F="${EXEC_FILE:-$RUNNER_TEMP/claude-execution-output.json}"
          if [ -s "$F" ]; then
            jq -s 'if length==1 and (.[0]|type)=="array" then .[0] else . end' "$F" > /tmp/msgs.json 2>/dev/null || echo '[]' > /tmp/msgs.json
          else echo '[]' > /tmp/msgs.json; fi
          jq --arg outcome "$OUTCOME" --arg issue "$ISSUE" --arg run_id "$GITHUB_RUN_ID" --arg run_url "$RUN_URL" --arg repo "$GITHUB_REPOSITORY" '
            (map(select(.type=="result"))|last) as $r
            | (map(select(.type=="system" and .subtype=="init"))|first) as $i
            | ($r.modelUsage // {}) as $mu
            | def musum(k): ([$mu[]|.[k]?|numbers]|if length>0 then add else null end);
            {schema:"claude-usage/1", repo:$repo,
             issue:($issue|tonumber? // null), run_id:($run_id|tonumber), run_url:$run_url,
             model:($i.model // null), outcome:(if $outcome=="" then null else $outcome end),
             result_subtype:($r.subtype // null),
             tokens_in:($r.usage.input_tokens // musum("inputTokens")),
             tokens_out:($r.usage.output_tokens // musum("outputTokens")),
             cache_read:($r.usage.cache_read_input_tokens // musum("cacheReadInputTokens")),
             cache_creation:($r.usage.cache_creation_input_tokens // musum("cacheCreationInputTokens")),
             turns:($r.num_turns // null), total_cost_usd:($r.total_cost_usd // null),
             duration_ms:($r.duration_ms // null)}' /tmp/msgs.json > usage.json 2>/dev/null \
            || jq -n --arg o "$OUTCOME" --arg i "$ISSUE" --arg r "$GITHUB_RUN_ID" --arg u "$RUN_URL" '{schema:"claude-usage/1",issue:($i|tonumber? // null),run_id:($r|tonumber),run_url:$u,outcome:$o,model:null,tokens_in:null,tokens_out:null,cache_read:null,cache_creation:null,turns:null,total_cost_usd:null,duration_ms:null}' > usage.json
          jq -r '"Claude usage: model=\(.model) in=\(.tokens_in) out=\(.tokens_out) cache_read=\(.cache_read) turns=\(.turns) cost_equiv_usd=\(.total_cost_usd) duration_ms=\(.duration_ms) outcome=\(.outcome)"' usage.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload usage artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: claude-usage
          path: usage.json
          retention-days: 90
          if-no-files-found: ignore
      - name: Mark blocked on failure
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create blocked --repo "$GITHUB_REPOSITORY" --color B60205 2>/dev/null || true
          gh issue edit ${{ github.event.issue.number }} --repo "$GITHUB_REPOSITORY" --add-label blocked --remove-label building
          gh issue comment ${{ github.event.issue.number }} --repo "$GITHUB_REPOSITORY" --body "Claude Builder run failed or timed out: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID — marked blocked."
